services:
  rclona:
    build: .
    image: rclona:latest
    container_name: rclona
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      PANEL_USER: "${PANEL_USER:-admin}"
      PANEL_PASSWORD: "${PANEL_PASSWORD:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      # 全部数据（网盘配置、任务、记录、设置）都在这一个卷里
      - rclona-data:/data
      # 【可选】想备份「这台服务器上的文件」时，取消下面一行的注释，再执行 docker compose up -d 重建容器：
      # 它会把服务器的根目录只读挂载到容器里的 /host（只读：面板只能读、不能改删服务器文件），
      # 然后在面板里添加一个「本地目录」网盘，建任务时从 /host 里挑要备份的目录即可。
      # 不需要这个功能就别取消注释——默认不开，面板看不到服务器文件，更稳妥。
      # - /:/host:ro

volumes:
  rclona-data:
